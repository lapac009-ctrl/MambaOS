<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mamba OS | Ultimate Desktop</title>
    <style>
        :root {
            --neon: #00ffff;
            --glass: rgba(255, 255, 255, 0.1);
            --shadow: 0 0 20px rgba(0, 255, 255, 0.4);
        }

        body, html {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            background: url('https://images.unsplash.com/photo-1614850523296-d8c1af93d400?q=80&w=2070') no-repeat center center fixed;
            background-size: cover;
            color: white;
        }

        /* --- BOOT / LOGIN SCREEN --- */
        #login-screen {
            position: fixed; inset: 0; z-index: 9999;
            background: radial-gradient(circle, #0a0a0a 0%, #000 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: transform 0.8s cubic-bezier(0.85, 0, 0.15, 1);
        }

        .login-box {
            background: var(--glass); padding: 50px; border-radius: 25px;
            backdrop-filter: blur(20px); border: 1px solid var(--neon);
            text-align: center; box-shadow: var(--shadow);
        }

        .mamba-logo { font-size: 50px; font-weight: 900; color: var(--neon); text-shadow: var(--shadow); margin-bottom: 20px; }
        
        input {
            background: rgba(0,0,0,0.6); border: 1px solid var(--neon);
            color: white; padding: 12px; border-radius: 8px; width: 250px;
            outline: none; text-align: center; font-size: 18px;
        }

        .btn-login {
            background: var(--neon); color: black; border: none; font-weight: bold;
            padding: 12px 30px; margin-top: 20px; border-radius: 8px; cursor: pointer;
            transition: 0.3s; box-shadow: var(--shadow);
        }

        /* --- DESKTOP AREA --- */
        #desktop { width: 100%; height: 100vh; position: relative; display: none; }

        /* --- TASKBAR --- */
        #taskbar {
            position: absolute; bottom: 0; width: 100%; height: 55px;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(15px);
            border-top: 1px solid var(--neon); display: flex; align-items: center;
            padding: 0 20px; box-sizing: border-box; z-index: 1000;
        }

        .start-btn {
            background: var(--neon); color: black; border: none; padding: 8px 20px;
            font-weight: 900; border-radius: 5px; cursor: pointer; box-shadow: var(--shadow);
        }

        .search-container { margin-left: 20px; flex-grow: 0.3; }
        .search-bar {
            width: 100%; background: var(--glass); border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 15px; border-radius: 20px; color: white; outline: none;
        }

        .sys-tray { margin-left: auto; display: flex; gap: 20px; font-size: 14px; color: var(--neon); }

        /* --- WINDOWS --- */
        .window {
            position: absolute; width: 600px; height: 400px; top: 15%; left: 25%;
            background: rgba(10, 10, 10, 0.85); border: 1px solid var(--neon);
            border-radius: 12px; backdrop-filter: blur(10px); box-shadow: var(--shadow);
            display: none; flex-direction: column; overflow: hidden;
        }

        .win-header {
            padding: 12px; background: rgba(0, 255, 255, 0.15);
            display: flex; justify-content: space-between; align-items: center;
            cursor: move; border-bottom: 1px solid var(--neon);
        }

        .win-body { padding: 25px; flex: 1; font-family: 'Consolas', monospace; color: #00ff00; }

        .app-icon {
            width: 80px; height: 80px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; cursor: pointer;
            margin: 20px; transition: 0.2s;
        }
        .app-icon:hover { background: var(--glass); border-radius: 10px; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <div class="mamba-logo">🐍 MAMBA OS</div>
        <p>Prijavi se kao GAZDA</p>
        <input type="password" id="pass" placeholder="Šifra: mamba123">
        <br>
        <button class="btn-login" onclick="login()">OTKLJUČAJ SISTEM</button>
    </div>
</div>

<div id="desktop">
    <div class="app-icon" onclick="openWin()">
        <span style="font-size: 40px;">📂</span>
        <span>My Files</span>
    </div>

    <div class="window" id="main-win">
        <div class="win-header" id="win-header">
            <span style="font-weight: bold; color: var(--neon);">SYSTEM DASHBOARD</span>
            <span onclick="closeWin()" style="color: red; cursor: pointer; font-weight: bold;">[X]</span>
        </div>
        <div class="win-body">
            <p>> Boot Sequence: COMPLETE</p>
            <p>> User: OGNJEN (ROOT)</p>
            <p>> Hardware: Virtualized 64GB RAM</p>
            <p>> Status: <span style="color: #fff; text-shadow: 0 0 10px #fff;">SYSTEM ONLINE</span></p>
            <hr border="1" color="#00ffff">
            <p>Ukucaj ime sajta u pretragu dole da ga otvoriš.</p>
        </div>
    </div>

    <div id="taskbar">
        <button class="start-btn" onclick="openWin()">MAMBA</button>
        
        <div class="search-container">
            <input type="text" class="search-bar" id="search" placeholder="Pretraži aplikacije (npr. youtube, roblox)...">
        </div>

        <div class="sys-tray">
            <span>📶 Connected</span>
            <span>🔋 100%</span>
            <span id="clock" style="font-weight: bold; font-size: 18px;"></span>
        </div>
    </div>
</div>

<script>
    // LOGIN LOGIKA
    function login() {
        const p = document.getElementById('pass').value;
        if(p === "mamba123") {
            document.getElementById('login-screen').style.transform = "translateY(-100%)";
            setTimeout(() => {
                document.getElementById('login-screen').style.display = "none";
                document.getElementById('desktop').style.display = "block";
            }, 800);
        } else {
            alert("Samo Gazda Ognjen zna šifru!");
        }
    }

    // SAT
    function updateClock() {
        const now = new Date();
        document.getElementById('clock').innerText = now.getHours().toString().padStart(2, '0') + ":" + 
                                                     now.getMinutes().toString().padStart(2, '0');
    }
    setInterval(updateClock, 1000);
    updateClock();

    // PROZOR KONTROLA
    function openWin() { document.getElementById('main-win').style.display = "flex"; }
    function closeWin() { document.getElementById('main-win').style.display = "none"; }

    // SEARCH APPS
    document.getElementById('search').addEventListener('keypress', function(e) {
        if(e.key === 'Enter') {
            const val = this.value.toLowerCase();
            if(val.includes("google")) window.open("https://google.com");
            else if(val.includes("youtube")) window.open("https://youtube.com");
            else if(val.includes("discord")) window.open("https://discord.com");
            else if(val.includes("roblox")) window.open("https://roblox.com");
            else alert("Aplikacija '" + val + "' nije instalirana, ali je tražim na webu...");
            this.value = "";
        }
    });

    // DRAG WINDOW (Pomeranje mišem)
    const win = document.getElementById("main-win");
    const header = document.getElementById("win-header");
    let isDragging = false;
    let offset = [0,0];

    header.onmousedown = (e) => {
        isDragging = true;
        offset = [win.offsetLeft - e.clientX, win.offsetTop - e.clientY];
    };
    document.onmousemove = (e) => {
        if(isDragging) {
            win.style.left = (e.clientX + offset[0]) + 'px';
            win.style.top = (e.clientY + offset[1]) + 'px';
        }
    };
    document.onmouseup = () => isDragging = false;

</script>
</body>
</html>
