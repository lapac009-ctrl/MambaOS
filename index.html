<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <title>Mamba OS - Gazda Edition</title>
    <style>
        :root {
            --neon: #00ffff;
            --glass: rgba(255, 255, 255, 0.1);
            --bg-dark: rgba(10, 10, 10, 0.9);
        }

        body, html {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            background: url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2072&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
        }

        /* LOGIN SCREEN */
        #login-screen {
            position: fixed; inset: 0; z-index: 999;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(20px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: 0.5s;
        }

        .login-card {
            background: var(--glass); padding: 40px; border-radius: 20px;
            border: 1px solid var(--neon); text-align: center;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
        }

        .login-card h1 { color: var(--neon); margin-bottom: 20px; }

        input[type="password"], input[type="text"] {
            background: rgba(0,0,0,0.5); border: 1px solid var(--neon);
            color: white; padding: 10px; border-radius: 5px; width: 200px; outline: none;
        }

        .btn {
            background: var(--neon); color: black; border: none;
            padding: 10px 20px; margin-top: 15px; cursor: pointer; font-weight: bold;
            border-radius: 5px; transition: 0.3s;
        }

        /* DESKTOP */
        #desktop { width: 100%; height: 100%; display: none; }

        /* TASKBAR */
        #taskbar {
            position: absolute; bottom: 0; width: 100%; height: 50px;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(15px);
            border-top: 1px solid var(--neon); display: flex; align-items: center; padding: 0 15px;
            box-sizing: border-box; z-index: 100;
        }

        .start-group { display: flex; gap: 15px; align-items: center; }
        .system-group { margin-left: auto; display: flex; gap: 15px; align-items: center; color: var(--neon); font-size: 14px; }

        .search-bar {
            background: var(--glass); border: 1px solid var(--neon);
            border-radius: 20px; padding: 5px 15px; color: white; width: 250px;
        }

        /* WINDOWS */
        .window {
            position: absolute; top: 15%; left: 20%; width: 600px; height: 400px;
            background: var(--bg-dark); border: 1px solid var(--neon);
            border-radius: 12px; box-shadow: 0 0 20px rgba(0,255,255,0.2);
            backdrop-filter: blur(10px); display: none; flex-direction: column;
        }

        .win-header {
            padding: 10px; background: rgba(0,255,255,0.1);
            display: flex; justify-content: space-between; border-bottom: 1px solid var(--neon);
            cursor: move;
        }

        .win-body { padding: 20px; color: white; overflow-y: auto; flex: 1; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-card">
        <h1 id="user-welcome">MAMBA OS LOGIN</h1>
        <input type="password" id="pass-input" placeholder="Unesi šifru...">
        <br>
        <button class="btn" onclick="checkPass()">OTJUČAJ</button>
        <p style="color: #666; font-size: 12px; margin-top: 10px;">Hint: mamba123</p>
    </div>
</div>

<div id="desktop">
    <div class="window" id="browser-win">
        <div class="win-header">
            <span style="color: var(--neon)">Mamba Browser</span>
            <span onclick="closeWin()" style="cursor:pointer; color:red">✖</span>
        </div>
        <div class="win-body">
            <h3>Dobrodošao Gazda!</h3>
            <p>Sistem je stabilan. Sve aplikacije su spremne za rad.</p>
            <hr border="1" color="#00ffff">
            <p>> CPU: 2% | RAM: 64GB | NET: Connected</p>
        </div>
    </div>

    <div id="taskbar">
        <div class="start-group">
            <button id="start-btn" class="btn" style="margin:0" onclick="toggleWin()">MAMBA</button>
            <input type="text" class="search-bar" placeholder="Traži aplikaciju..." id="search-input">
        </div>

        <div class="system-group">
            <span id="battery">🔋 98%</span>
            <span id="wifi">🌐 Connected</span>
            <span id="clock" style="font-weight: bold; font-size: 16px;">00:00</span>
        </div>
    </div>
</div>

<script>
    const correctPass = "mamba123";

    // LOGIN LOGIKA
    function checkPass() {
        const input = document.getElementById('pass-input').value;
        if(input === correctPass) {
            document.getElementById('login-screen').style.opacity = "0";
            setTimeout(() => {
                document.getElementById('login-screen').style.display = "none";
                document.getElementById('desktop').style.display = "block";
            }, 500);
        } else {
            alert("Pogrešna šifra, gazda!");
        }
    }

    // SAT
    function startTime() {
        const today = new Date();
        let h = today.getHours();
        let m = today.getMinutes();
        m = m < 10 ? "0"+m : m;
        document.getElementById('clock').innerHTML = h + ":" + m;
        setTimeout(startTime, 1000);
    }
    startTime();

    // SEARCH / LAUNCHER (Logika za "prave" aplikacije)
    document.getElementById('search-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            const app = this.value.toLowerCase();
            if(app === "google") window.open("https://google.com");
            if(app === "discord") window.open("https://discord.com");
            if(app === "youtube") window.open("https://youtube.com");
            if(app === "roblox") window.open("https://roblox.com");
            this.value = "";
        }
    });

    // WINDOW CONTROL
    function toggleWin() {
        const win = document.getElementById('browser-win');
        win.style.display = win.style.display === "flex" ? "none" : "flex";
    }
    function closeWin() { document.getElementById('browser-win').style.display = "none"; }

</script>

</body>
</html>
